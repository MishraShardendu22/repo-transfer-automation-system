services:
  repo-transfer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repo-transfer-engine
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - APP_URL=http://localhost:8080
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_TOKEN_CLASSIC=${GITHUB_TOKEN_CLASSIC:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 20s
      timeout: 5s
      retries: 3
